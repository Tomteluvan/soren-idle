<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>Ferrite — ship database</title>
  <defs>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#eafaff"/><stop offset="1" stop-color="#ccecf8"/></linearGradient>
    <linearGradient id="ore" x2="0.8" y2="1"><stop stop-color="#b78366"/><stop offset="1" stop-color="#76554b"/></linearGradient>
    <linearGradient id="steel" x2="1" y2="1"><stop stop-color="#effcff"/><stop offset=".5" stop-color="#99c5d2"/><stop offset="1" stop-color="#5d8b9a"/></linearGradient>
    <pattern id="scan" width="4" height="5" patternUnits="userSpaceOnUse"><path d="M0 0h4" stroke="#478fa0" stroke-opacity=".16" stroke-width="1"/></pattern>
  </defs>
  <rect width="400" height="300" rx="24" fill="#102532"/>
  <rect x="12" y="12" width="376" height="276" rx="18" fill="url(#screen)" stroke="#81c6d8" stroke-width="2"/>
  <path d="M30 56h340" stroke="#abdce9" stroke-width="1.5"/>
  <circle cx="37" cy="35" r="5" fill="#44b9c7"/><text x="50" y="39" fill="#376277" font-family="Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="1.4">SHIP DATABASE</text>
  <text x="338" y="39" fill="#5692a3" font-family="Arial,sans-serif" font-size="10" letter-spacing="1">MINERAL 07</text>
  <text x="34" y="82" fill="#163e53" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="1">FERRITE</text>
  <text x="35" y="99" fill="#588396" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.2">COMMON METALLIC ORE</text>
  <!-- clean display field -->
  <rect x="31" y="111" width="338" height="151" rx="12" fill="#d9f2fa"/>
  <path d="M47 219h306" stroke="#9ccbd7" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="197" cy="219" rx="82" ry="10" fill="#b3d9e2" opacity=".55"/>
  <!-- rock resting firmly on the surface -->
  <path d="M139 214c-8-5-11-14-8-23l10-27c4-10 14-17 25-19l28-5c10-2 20 3 26 11l17 22c6 8 5 19-2 26l-13 13c-5 5-12 8-20 8h-45c-7 0-13-2-18-6z" fill="url(#ore)" stroke="#694c45" stroke-width="2"/>
  <path d="M144 168c5-11 15-18 27-20l17-3-11 20-19 9-10 21-14-4z" fill="#d3a17f" opacity=".85"/>
  <path d="M188 146l18-3c10-1 19 4 24 12l10 13-22 2-15-10-21 8-5-8z" fill="#98694f"/>
  <path d="M139 197l19 4 10 16h-20c-7-4-11-11-9-20zM207 213l20-10 11 4-13 13h-18z" fill="#604a45" opacity=".8"/>
  <path d="M180 171l10-5 8 5-7 9-11-2zM216 184l7-3 5 6-8 5z" fill="#f1d09a"/>
  <!-- mining pick: solid steel head, gripped tapered handle -->
  <path d="M254 74 189 153" fill="none" stroke="#285f71" stroke-width="14" stroke-linecap="round"/>
  <path d="M254 74 189 153" fill="none" stroke="#6fa8b6" stroke-width="8" stroke-linecap="round"/>
  <path d="M191 152l-3 17" stroke="#285f71" stroke-width="16" stroke-linecap="round"/>
  <path d="M132 136c11-8 24-11 37-7l15 8 13-15c10-11 23-17 39-19l8-1-9 12c-10 13-22 22-37 27l-16 4-13 13-7-2 1-15-13-7c-7-3-15-3-25 1z" fill="url(#steel)" stroke="#507f8e" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M138 135c10-5 21-6 30-3l14 8 14-16c9-9 20-14 32-17" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <path d="M180 135l10 6-12 13-7-2 1-14z" fill="#547b88" stroke="#d9f7f5" stroke-width="1.5"/>
  <!-- subtle contact glint -->
  <path d="M177 168l-7 3m13 3-5 7m13-10 3 5" stroke="#fff1b7" stroke-width="2" stroke-linecap="round"/>
  <!-- light display interference, stronger at the edges -->
  <rect x="31" y="111" width="338" height="151" rx="12" fill="url(#scan)"/>
  <path d="M34 129h38v2H34zM319 145h48v2h-48zM34 206h21v2H34zM345 229h24v2h-24z" fill="#4b9dac" opacity=".28"/>
  <path d="M48 126h11m4 0h3M332 149h4m4 0h19M54 231h22" stroke="#efffff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
  <path d="M33 124h335" stroke="#fff" stroke-opacity=".38" stroke-width="3"/>
</svg>
